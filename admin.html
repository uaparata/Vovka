<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fauck Zini</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/app.css?v=16">
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-header">
      <h1>🛡️ Админ-панель</h1>
      <a href="/" class="back-link">← Игра</a>
    </header>

    <p class="admin-note">Доступ только для авторизованных администраторов. Рейтинг сортируется по всему заработанному.</p>

    <section class="admin-stats">
      <div class="stat-box">Игроков: <span id="player-count">0</span></div>
      <div class="stat-box">Забанено: <span id="banned-count">0</span></div>
      <div class="stat-box">Подозрительных: <span id="suspicious-count">0</span></div>
    </section>

    <div class="admin-toolbar">
      <input id="search-input" class="search-input" type="search" placeholder="Поиск по нику или email…" autocomplete="off">
      <button id="refresh-btn" class="btn btn-refresh" type="button">Обновить</button>
    </div>

    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Игрок</th>
            <th>Баланс</th>
            <th>Заработано</th>
            <th>Тапы</th>
            <th>Ур.</th>
            <th>⚠️</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="players-body"></tbody>
      </table>
    </div>
  </div>
  <script src="/admin/assets/app.js?v=16"></script>
</body>
</html>
