<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fauck Zini</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=10">
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-header">
      <h1>🛡️ Admin Panel</h1>
      <a href="/" class="back-link">← Игра</a>
    </header>

    <section class="admin-stats">
      <div class="stat-box">Игроков: <span id="player-count">0</span></div>
      <div class="stat-box">Забанено: <span id="banned-count">0</span></div>
    </section>

    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Игрок</th>
            <th>Баланс</th>
            <th>Уровень</th>
            <th>⚠️</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="players-body"></tbody>
      </table>
    </div>
  </div>
  <script src="admin.js?v=10"></script>
</body>
</html>
