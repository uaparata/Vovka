<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>Fauck Zini — Тапалка Вовы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="level-badge">
        <span class="level-label">Уровень</span>
        <span id="level" class="level-value">1</span>
      </div>
      <h1 class="title">Fauck Zini</h1>
      <div class="rank-badge" id="rank">Новичок</div>
    </header>

    <section id="auth-bar" class="auth-bar">
      <div id="auth-guest" class="auth-guest">
        <p class="auth-hint">Войди, чтобы сохранить прогресс в облаке</p>
        <a id="login-btn" class="auth-btn google-btn" href="/auth/google">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Войти через Google
        </a>
      </div>
      <div id="auth-user" class="auth-user hidden">
        <img id="user-avatar" class="user-avatar" src="" alt="">
        <div class="user-meta">
          <span id="user-name" class="user-name"></span>
          <span class="sync-status" id="sync-status">Сохранено</span>
        </div>
        <button id="logout-btn" class="auth-btn logout-btn" type="button">Выйти</button>
      </div>
    </section>

    <section class="balance-section">
      <div class="balance-card">
        <span class="balance-label">Зинкоины</span>
        <div class="balance-row">
          <span class="coin-icon">💪</span>
          <span id="balance" class="balance-value">0</span>
        </div>
        <div class="income-row">
          <span id="per-tap">+1 за тап</span>
          <span class="dot">·</span>
          <span id="per-hour">+0/час</span>
        </div>
      </div>
    </section>

    <section class="energy-section">
      <div class="energy-header">
        <span>Энергия</span>
        <span id="energy-text">1000 / 1000</span>
      </div>
      <div class="energy-bar">
        <div id="energy-fill" class="energy-fill"></div>
      </div>
    </section>

    <section class="tap-section">
      <div id="tap-zone" class="tap-zone">
        <div class="tap-ring tap-ring-1"></div>
        <div class="tap-ring tap-ring-2"></div>
        <img
          id="vova"
          src="assets/vova.png"
          alt="Вова Зинченко"
          class="vova-img"
          draggable="false"
        >
        <p class="tap-hint">Тапай Вову!</p>
      </div>
      <div id="float-container" class="float-container"></div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="upgrades">Улучшения</button>
      <button class="tab" data-tab="stats">Статистика</button>
    </nav>

    <section id="panel-upgrades" class="panel active">
      <div id="upgrades-list" class="upgrades-list"></div>
    </section>

    <section id="panel-stats" class="panel">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Всего тапов</span>
          <span id="stat-taps" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Всего заработано</span>
          <span id="stat-earned" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Улучшений куплено</span>
          <span id="stat-upgrades" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Ранг</span>
          <span id="stat-rank" class="stat-value">Новичок</span>
        </div>
      </div>
      <p class="footer-note">Сделано для Вовы Зинченко 💪</p>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
